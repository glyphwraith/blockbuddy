<!doctype html>
<html><head><meta charset="utf-8"><title>BlockBuddy</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<header>
  <h1><svg viewBox="0 0 20 20" width="30" height="30"><path d="M10 18C3 14 3 7 10 6c7 1 7 8 0 12z" fill="#d9566a"/><path d="M6 6l4-3 4 3-4 1z" fill="#7f9e6c"/></svg>BlockBuddy <small>a cozy Bedrock pack maker</small></h1>
  <div class="meta">
    <input id="pname" placeholder="Pack name" value="My Cute Pack">
    <input id="pdesc" placeholder="Description" value="Made with BlockBuddy 💖">
    <select id="pfmt"><option value="1.20.0">Bedrock 1.20+</option><option value="1.21.0" selected>Bedrock 1.21+</option></select>
    <button id="export" class="big">Export Pack</button>
  </div>
</header>
<nav id="tabs"></nav>
<main>
  <aside>
    <button id="loadbase" class="big">Load vanilla pack</button><input type="file" id="base" webkitdirectory multiple hidden>
    <input id="search" placeholder="🔍 Search…">
    <div id="list"></div>
    <div id="addrow"><input id="custom" placeholder="custom id e.g. amethyst_block"><button id="addbtn">＋</button></div>
  </aside>
  <section id="editor"><p class="hint">👈 Pick something from the list to start decorating!</p></section>
</main>
<div id="toast"></div>
<div id="critter"><div id="flip"><svg class="cat" viewBox="0 0 40 40" width="38" height="38"><path d="M7 14L9 3l8 6zM33 14l-2-11-8 6z" fill="#f1d9b5" stroke="#5a4636" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="20" cy="23" rx="15" ry="13" fill="#f7ecd6" stroke="#5a4636" stroke-width="1.6"/><path d="M26 11c5 1 9 6 8 12-4 0-8-3-8-12z" fill="#e3a569" opacity=".75"/><circle cx="14.5" cy="22" r="1.7" fill="#5a4636"/><circle cx="25.5" cy="22" r="1.7" fill="#5a4636"/><ellipse cx="10.5" cy="27" rx="3" ry="2" fill="#f3a9a0" opacity=".7"/><ellipse cx="29.5" cy="27" rx="3" ry="2" fill="#f3a9a0" opacity=".7"/><path d="M18 26q2 2 4 0" fill="none" stroke="#5a4636" stroke-width="1.4" stroke-linecap="round"/></svg></div></div>
<script src="blocks.js"></script><script src="app.js"></script>
</body></html>
